<!DOCTYPE html>

<html lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Pipeline Sayaç - Ana Sayfa</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error": "#ffffff",
                        "surface-tint": "#494bd6",
                        "surface-bright": "#f7f9fb",
                        "tertiary": "#904900",
                        "tertiary-fixed-dim": "#ffb783",
                        "secondary-fixed-dim": "#cebdff",
                        "primary-fixed-dim": "#c0c1ff",
                        "surface-dim": "#d8dadc",
                        "surface-container-highest": "#e0e3e5",
                        "inverse-surface": "#2d3133",
                        "primary-fixed": "#e1e0ff",
                        "on-secondary-fixed-variant": "#4f319c",
                        "on-background": "#191c1e",
                        "outline": "#767586",
                        "surface-container-lowest": "#ffffff",
                        "surface": "#f7f9fb",
                        "on-primary": "#ffffff",
                        "on-tertiary-fixed-variant": "#703700",
                        "tertiary-fixed": "#ffdcc5",
                        "outline-variant": "#c7c4d7",
                        "on-tertiary-container": "#fffbff",
                        "error": "#ba1a1a",
                        "secondary-fixed": "#e8ddff",
                        "surface-container-low": "#f2f4f6",
                        "on-secondary-container": "#3f1e8c",
                        "on-primary-fixed": "#07006c",
                        "on-tertiary": "#ffffff",
                        "on-surface": "#191c1e",
                        "primary": "#4648d4",
                        "inverse-on-surface": "#eff1f3",
                        "on-error-container": "#93000a",
                        "secondary": "#674bb5",
                        "on-primary-fixed-variant": "#2f2ebe",
                        "surface-variant": "#e0e3e5",
                        "error-container": "#ffdad6",
                        "surface-container-high": "#e6e8ea",
                        "surface-container": "#eceef0",
                        "tertiary-container": "#b55d00",
                        "background": "#f7f9fb",
                        "secondary-container": "#ab8ffe",
                        "inverse-primary": "#c0c1ff",
                        "on-secondary": "#ffffff",
                        "on-primary-container": "#fffbff",
                        "on-secondary-fixed": "#21005e",
                        "on-surface-variant": "#464554",
                        "on-tertiary-fixed": "#301400",
                        "primary-container": "#6063ee"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Inter"],
                        "display": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                }
            }
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fb;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col antialiased">
<!-- TopAppBar (Web & Mobile Hybrid) -->
<header class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl docked full-width top-0 no-border bg-slate-50/50 dark:bg-slate-800/50 shadow-sm shadow-indigo-500/5 z-40 hidden md:flex">
<div class="flex justify-between items-center w-full px-6 py-4 max-w-7xl mx-auto">
<div class="flex items-center gap-4">
<span class="text-2xl font-bold bg-gradient-to-br from-indigo-600 to-violet-500 bg-clip-text text-transparent tracking-tight">Pipeline Sayaç</span>
</div>
<nav class="flex items-center gap-8">
<a class="text-indigo-600 dark:text-indigo-400 font-bold hover:bg-slate-100/50 dark:hover:bg-slate-800/50 transition-colors rounded-lg px-4 py-2 scale-95 active:transition-transform" href="#">
                    Sayaç
                </a>
<a class="text-slate-500 dark:text-slate-400 hover:bg-slate-100/50 dark:hover:bg-slate-800/50 transition-colors rounded-lg px-4 py-2 scale-95 active:transition-transform" href="#">
                    Geçmiş
                </a>
<a class="text-slate-500 dark:text-slate-400 hover:bg-slate-100/50 dark:hover:bg-slate-800/50 transition-colors rounded-lg px-4 py-2 scale-95 active:transition-transform" href="#">
                    Ayarlar
                </a>
</nav>
<div class="flex items-center gap-4">
<button class="p-2 rounded-full text-slate-500 hover:bg-slate-100 transition-colors">
<span class="material-symbols-outlined">settings</span>
</button>
</div>
</div>
</header>
<!-- Mobile Top Header (Fallback) -->
<header class="md:hidden flex justify-between items-center px-6 py-5 bg-white/80 backdrop-blur-xl z-40 sticky top-0">
<span class="text-xl font-bold bg-gradient-to-br from-indigo-600 to-violet-500 bg-clip-text text-transparent">Pipeline Sayaç</span>
<button class="p-2 text-slate-500">
<span class="material-symbols-outlined">settings</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center p-6 md:p-12 pb-32 md:pb-12 max-w-5xl mx-auto w-full">
<!-- Hero Counter Area -->
<section class="w-full flex flex-col items-center justify-center gap-12 relative z-10">
<!-- Title -->
<div class="text-center">
<h1 class="text-[1.5rem] font-bold font-headline text-on-background tracking-tight mb-2">Günlük İlerleme</h1>
<p class="text-sm text-on-surface-variant font-body tracking-[0.01em]">Bugünkü sayımlarınız</p>
</div>
<!-- The Counter Gallery Display -->
<div class="relative w-full max-w-sm aspect-square bg-surface-bright rounded-[2rem] flex items-center justify-center flex-col relative before:absolute before:inset-0 before:bg-gradient-to-br before:from-primary/5 before:to-transparent before:rounded-[2rem] before:pointer-events-none">
<!-- Tonal Glow -->
<div class="absolute inset-0 bg-primary/5 blur-3xl rounded-full -z-10"></div>
<div class="text-[6rem] md:text-[8rem] font-bold font-display text-primary leading-none tracking-tighter drop-shadow-[0_8px_32px_rgba(70,72,212,0.15)] relative z-10">
                    42
                </div>
<!-- Status Chip -->
<div class="mt-8 px-6 py-2 bg-secondary-fixed rounded-full inline-flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
<span class="text-sm font-medium text-on-secondary-fixed font-label">Aktif Sayım</span>
</div>
</div>
<!-- Kinetic Action Controls -->
<div class="flex items-center gap-6 mt-4 w-full max-w-md justify-center">
<!-- Azalt (-) -->
<button class="w-16 h-16 rounded-[1rem] bg-surface-container-highest text-on-surface flex items-center justify-center hover:bg-surface-variant transition-colors group shadow-[0_8px_32px_rgba(25,28,30,0.06)]">
<span class="material-symbols-outlined text-3xl group-active:scale-90 transition-transform">remove</span>
</button>
<!-- Arttır (+) Primary -->
<button class="w-24 h-24 rounded-[1.25rem] bg-gradient-to-br from-primary to-primary-container text-on-primary flex items-center justify-center shadow-[0_12px_40px_rgba(70,72,212,0.25)] hover:shadow-[0_16px_48px_rgba(70,72,212,0.35)] transition-all relative overflow-hidden group">
<!-- Inner Edge Highlight -->
<div class="absolute top-0 left-0 right-0 h-1 bg-white/20 rounded-t-[1.25rem]"></div>
<span class="material-symbols-outlined text-5xl group-active:scale-90 transition-transform">add</span>
</button>
<!-- Sıfırla (Reset) -->
<button class="w-16 h-16 rounded-[1rem] bg-surface-container-highest text-on-surface flex items-center justify-center hover:bg-surface-variant transition-colors group shadow-[0_8px_32px_rgba(25,28,30,0.06)]">
<span class="material-symbols-outlined text-2xl group-active:-rotate-90 transition-transform duration-300">refresh</span>
</button>
</div>
</section>
<!-- Keyboard Shortcuts Guide -->
<section class="mt-20 w-full max-w-md mx-auto">
<div class="bg-surface-container-low rounded-[1.5rem] p-6 relative">
<!-- Ghost Border -->
<div class="absolute inset-0 rounded-[1.5rem] border border-outline-variant/15 pointer-events-none"></div>
<h3 class="text-sm font-medium text-on-surface-variant mb-4 font-label flex items-center gap-2">
<span class="material-symbols-outlined text-lg">keyboard</span>
                    Klavye Kısayolları
                </h3>
<div class="flex flex-col gap-3">
<div class="flex justify-between items-center px-2">
<span class="text-sm text-on-surface font-body">Arttır</span>
<kbd class="px-3 py-1 bg-surface-container-lowest text-on-surface rounded-lg text-xs font-mono font-medium shadow-sm outline outline-1 outline-outline-variant/20">+</kbd>
</div>
<div class="flex justify-between items-center px-2">
<span class="text-sm text-on-surface font-body">Azalt</span>
<kbd class="px-3 py-1 bg-surface-container-lowest text-on-surface rounded-lg text-xs font-mono font-medium shadow-sm outline outline-1 outline-outline-variant/20">-</kbd>
</div>
<div class="flex justify-between items-center px-2">
<span class="text-sm text-on-surface font-body">Sıfırla</span>
<kbd class="px-3 py-1 bg-surface-container-lowest text-on-surface rounded-lg text-xs font-mono font-medium shadow-sm outline outline-1 outline-outline-variant/20">R</kbd>
</div>
</div>
</div>
</section>
</main>
<!-- BottomNavBar (Mobile Only) -->
<nav class="md:hidden bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl fixed bottom-0 w-full rounded-t-[2rem] no-border shadow-[0_-8px_30px_rgb(0,0,0,0.04)] z-50 flex justify-around items-center px-4 pb-8 pt-4">
<a class="flex flex-col items-center justify-center bg-indigo-50 dark:bg-indigo-900/30 text-indigo-700 dark:text-indigo-300 rounded-2xl px-5 py-2 active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined text-2xl mb-1" style="font-variation-settings: 'FILL' 1;">timer</span>
<span class="text-[10px] font-medium tracking-wider uppercase">Sayaç</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-5 py-2 hover:text-indigo-500 transition-all active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined text-2xl mb-1">history</span>
<span class="text-[10px] font-medium tracking-wider uppercase">Geçmiş</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-5 py-2 hover:text-indigo-500 transition-all active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined text-2xl mb-1">settings</span>
<span class="text-[10px] font-medium tracking-wider uppercase">Ayarlar</span>
</a>
</nav>
</body></html>
